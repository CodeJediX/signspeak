name: Build SignSpeak Junior APK

on:
  push:
    branches: [signspeak-junior-mobile-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android source
        shell: bash
        run: |
          mkdir -p junior-android
          python3 - <<'PY'
          from pathlib import Path
          p = Path('junior-android-source/chunk-02.b64')
          s = p.read_text()
          if len(s) == 11999:
              s = s[:6052] + 'E' + s[6052:]
              p.write_text(s)
          assert len(p.read_text()) == 12000
          PY
          : > junior-android-source.zip
          for f in junior-android-source/chunk-*.b64; do
            echo "Decoding $f"
            base64 --decode "$f" >> junior-android-source.zip
          done
          echo "939c8cead807fff5b88d846f77efaedc81d31409a60c5abb407457bacaa9fb5c  junior-android-source.zip" | sha256sum -c -
          unzip -t junior-android-source.zip
          unzip -q junior-android-source.zip -d junior-android
          test -f junior-android/app/build.gradle
          test -f junior-android/app/src/main/assets/www/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: junior-android
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp junior-android/app/build/outputs/apk/debug/app-debug.apk junior-android/app/build/outputs/apk/debug/SignSpeak-Junior-v1.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SignSpeak-Junior-APK
          path: junior-android/app/build/outputs/apk/debug/SignSpeak-Junior-v1.4.apk
          if-no-files-found: error
