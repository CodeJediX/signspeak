name: Build SignSpeak Junior APK

on:
  push:
    branches: [signspeak-junior-mobile-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android source
        shell: bash
        run: |
          mkdir -p junior-android
          cat junior-android-source/chunk-*.b64 | base64 --decode > junior-android-source.zip
          unzip -q junior-android-source.zip -d junior-android
          test -f junior-android/app/build.gradle
          test -f junior-android/app/src/main/assets/www/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: junior-android
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp junior-android/app/build/outputs/apk/debug/app-debug.apk junior-android/app/build/outputs/apk/debug/SignSpeak-Junior-v1.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SignSpeak-Junior-APK
          path: junior-android/app/build/outputs/apk/debug/SignSpeak-Junior-v1.4.apk
          if-no-files-found: error
